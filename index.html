<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

      <title>หลังบ้าน</title>

        <style>

            *{
                  margin:0;
                        padding:0;
                              box-sizing:border-box;
                                    font-family:sans-serif;
                                        }

                                            body{
                                                  background:#f4f4f2;
                                                        color:#2d2d2d;
                                                              min-height:100vh;
                                                                    display:flex;
                                                                          flex-direction:column;
                                                                              }

                                                                                  /* แถบบน */

                                                                                      .topbar{
                                                                                            width:100%;
                                                                                                  background:white;

                                                                                                        padding:20px 24px;

                                                                                                              border-bottom:1px solid #e8e8e8;

                                                                                                                    display:flex;
                                                                                                                          align-items:center;
                                                                                                                              }

                                                                                                                                  .logo{
                                                                                                                                        font-size:22px;
                                                                                                                                              font-weight:700;
                                                                                                                                                    color:#2f2f2f;
                                                                                                                                                          letter-spacing:-0.5px;
                                                                                                                                                              }

                                                                                                                                                                  .logo span{
                                                                                                                                                                        opacity:0.7;
                                                                                                                                                                              margin-right:6px;
                                                                                                                                                                                  }

                                                                                                                                                                                      /* กลางจอ */

                                                                                                                                                                                          .container{
                                                                                                                                                                                                flex:1;

                                                                                                                                                                                                      display:flex;
                                                                                                                                                                                                            justify-content:center;
                                                                                                                                                                                                                  align-items:center;

                                                                                                                                                                                                                        padding:24px;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                .card{
                                                                                                                                                                                                                                      width:100%;
                                                                                                                                                                                                                                            max-width:420px;

                                                                                                                                                                                                                                                  background:white;

                                                                                                                                                                                                                                                        border-radius:30px;

                                                                                                                                                                                                                                                              padding:38px 28px;

                                                                                                                                                                                                                                                                    box-shadow:
                                                                                                                                                                                                                                                                          0 4px 30px rgba(0,0,0,0.04);
                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                  .title{
                                                                                                                                                                                                                                                                                        font-size:34px;
                                                                                                                                                                                                                                                                                              font-weight:700;

                                                                                                                                                                                                                                                                                                    color:#2f2f2f;

                                                                                                                                                                                                                                                                                                          margin-bottom:14px;

                                                                                                                                                                                                                                                                                                                line-height:1.2;
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                        .subtitle{
                                                                                                                                                                                                                                                                                                                              font-size:15px;
                                                                                                                                                                                                                                                                                                                                    line-height:1.7;

                                                                                                                                                                                                                                                                                                                                          color:#7a7a7a;

                                                                                                                                                                                                                                                                                                                                                margin-bottom:34px;
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                        /* ปุ่ม */

                                                                                                                                                                                                                                                                                                                                                            .start-btn{
                                                                                                                                                                                                                                                                                                                                                                  width:100%;

                                                                                                                                                                                                                                                                                                                                                                        border:none;

                                                                                                                                                                                                                                                                                                                                                                              background:#d8d6d1;

                                                                                                                                                                                                                                                                                                                                                                                    color:#2f2f2f;

                                                                                                                                                                                                                                                                                                                                                                                          padding:18px;

                                                                                                                                                                                                                                                                                                                                                                                                border-radius:18px;

                                                                                                                                                                                                                                                                                                                                                                                                      font-size:17px;
                                                                                                                                                                                                                                                                                                                                                                                                            font-weight:600;

                                                                                                                                                                                                                                                                                                                                                                                                                  cursor:pointer;

                                                                                                                                                                                                                                                                                                                                                                                                                        transition:0.2s;
                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                .start-btn:active{
                                                                                                                                                                                                                                                                                                                                                                                                                                      transform:scale(0.98);
                                                                                                                                                                                                                                                                                                                                                                                                                                            background:#cac7c1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* เมนูล่าง */

                                                                                                                                                                                                                                                                                                                                                                                                                                                        .bottom-menu{
                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-top:30px;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display:flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          justify-content:space-between;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size:14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .bottom-menu a{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color:#7a7a7a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-decoration:none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- แถบบน -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="topbar">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="logo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>▣</span>หลังบ้าน
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- กลาง -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="title">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    หลังบ้าน
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="subtitle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ระบบหลังบ้านแอดมินออนไลน์สำหรับแม่ค้า
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="start-btn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            เริ่มไลฟ์ใหม่
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="bottom-menu">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="#">เข้าสู่ระบบ</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a href="#">สมัครร้านค้า</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html
