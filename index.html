<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

      <title>หลังบ้าน</title>

        <style>

            *{
                  margin:0;
                        padding:0;
                              box-sizing:border-box;
                                    font-family:sans-serif;
                                        }

                                            body{
                                                  background:#121212;
                                                        color:white;
                                                              min-height:100vh;

                                                                    display:flex;
                                                                          flex-direction:column;
                                                                              }

                                                                                  /* แถบบน */

                                                                                      .topbar{
                                                                                            width:100%;

                                                                                                  padding:20px 24px;

                                                                                                        border-bottom:1px solid #222;

                                                                                                              background:#121212;

                                                                                                                    display:flex;
                                                                                                                          align-items:center;
                                                                                                                              }

                                                                                                                                  .logo{
                                                                                                                                        font-size:22px;
                                                                                                                                              font-weight:700;

                                                                                                                                                    color:white;

                                                                                                                                                          letter-spacing:-0.5px;
                                                                                                                                                              }

                                                                                                                                                                  .logo span{
                                                                                                                                                                        color:#ff2d55;
                                                                                                                                                                              margin-right:6px;
                                                                                                                                                                                  }

                                                                                                                                                                                      /* กลางจอ */

                                                                                                                                                                                          .container{
                                                                                                                                                                                                flex:1;

                                                                                                                                                                                                      display:flex;
                                                                                                                                                                                                            justify-content:center;
                                                                                                                                                                                                                  align-items:center;

                                                                                                                                                                                                                        padding:24px;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                .card{
                                                                                                                                                                                                                                      width:100%;
                                                                                                                                                                                                                                            max-width:420px;

                                                                                                                                                                                                                                                  background:#1b1b1b;

                                                                                                                                                                                                                                                        border-radius:30px;

                                                                                                                                                                                                                                                              padding:40px 28px;

                                                                                                                                                                                                                                                                    border:1px solid #2a2a2a;

                                                                                                                                                                                                                                                                          box-shadow:
                                                                                                                                                                                                                                                                                0 0 30px rgba(0,0,0,0.35);

                                                                                                                                                                                                                                                                                      text-align:center;
                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                              .title{
                                                                                                                                                                                                                                                                                                    font-size:38px;
                                                                                                                                                                                                                                                                                                          font-weight:700;

                                                                                                                                                                                                                                                                                                                color:white;

                                                                                                                                                                                                                                                                                                                      margin-bottom:12px;

                                                                                                                                                                                                                                                                                                                            letter-spacing:-1px;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                    .subtitle{
                                                                                                                                                                                                                                                                                                                                          font-size:16px;

                                                                                                                                                                                                                                                                                                                                                color:#b3b3b3;

                                                                                                                                                                                                                                                                                                                                                      line-height:1.6;

                                                                                                                                                                                                                                                                                                                                                            margin-bottom:36px;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                    /* ปุ่ม */

                                                                                                                                                                                                                                                                                                                                                                        .start-btn{
                                                                                                                                                                                                                                                                                                                                                                              width:100%;

                                                                                                                                                                                                                                                                                                                                                                                    border:none;

                                                                                                                                                                                                                                                                                                                                                                                          background:#ff2d55;

                                                                                                                                                                                                                                                                                                                                                                                                color:white;

                                                                                                                                                                                                                                                                                                                                                                                                      padding:18px;

                                                                                                                                                                                                                                                                                                                                                                                                            border-radius:18px;

                                                                                                                                                                                                                                                                                                                                                                                                                  font-size:17px;
                                                                                                                                                                                                                                                                                                                                                                                                                        font-weight:700;

                                                                                                                                                                                                                                                                                                                                                                                                                              cursor:pointer;

                                                                                                                                                                                                                                                                                                                                                                                                                                    transition:0.2s;
                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                            .start-btn:active{
                                                                                                                                                                                                                                                                                                                                                                                                                                                  transform:scale(0.98);

                                                                                                                                                                                                                                                                                                                                                                                                                                                        opacity:0.9;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* เมนูล่าง */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .bottom-menu{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-top:28px;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                display:flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      justify-content:space-between;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size:14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .bottom-menu a{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          color:#8d8d8d;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-decoration:none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- แถบบน -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="topbar">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="logo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>▣</span>หลังบ้าน
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- กลางจอ -->

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="title">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                หลังบ้าน
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="subtitle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    แอดมินออนไลน์สำหรับแม่ค้า
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="start-btn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        เริ่มไลฟ์ใหม่
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="bottom-menu">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="login.html">เข้าสู่ระบบ</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <a href="#">สมัครร้านค้า</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
