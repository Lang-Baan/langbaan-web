<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

      <title>หลังบ้าน</title>

        <style>
            body{
                  margin:0;
                        padding:0;
                              background:#fff7f7;
                                    font-family:sans-serif;
                                          display:flex;
                                                justify-content:center;
                                                      align-items:center;
                                                            height:100vh;
                                                                }

                                                                    .card{
                                                                          background:white;
                                                                                width:90%;
                                                                                      max-width:400px;
                                                                                            padding:30px;
                                                                                                  border-radius:24px;
                                                                                                        box-shadow:0 0 20px rgba(0,0,0,0.1);
                                                                                                              text-align:center;
                                                                                                                  }

                                                                                                                      h1{
                                                                                                                            color:#e11d48;
                                                                                                                                  margin-bottom:10px;
                                                                                                                                      }

                                                                                                                                          p{
                                                                                                                                                color:#666;
                                                                                                                                                      margin-bottom:25px;
                                                                                                                                                            line-height:1.5;
                                                                                                                                                                }

                                                                                                                                                                    button{
                                                                                                                                                                          width:100%;
                                                                                                                                                                                padding:15px;
                                                                                                                                                                                      border:none;
                                                                                                                                                                                            border-radius:14px;
                                                                                                                                                                                                  background:#e11d48;
                                                                                                                                                                                                        color:white;
                                                                                                                                                                                                              font-size:18px;
                                                                                                                                                                                                                  }
                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                      <div class="card">

                                                                                                                                                                                                                          <h1>🌹 หลังบ้าน</h1>

                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                    ระบบรวมยอดอัตโนมัติสำหรับแม่ค้าไลฟ์สด
                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                            <button>
                                                                                                                                                                                                                                                  เริ่มไลฟ์ใหม่
                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                        </html>
