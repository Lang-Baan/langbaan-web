<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>เข้าสู่ระบบ | หลังบ้าน</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:sans-serif;
    }

    body{
      background:#121212;
      color:white;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      padding:20px 24px;
      border-bottom:1px solid #222;
    }

    .logo{
      font-size:22px;
      font-weight:700;
    }

    .logo span{
      color:#ff2d55;
      margin-right:6px;
    }

    .container{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#1b1b1b;
      border:1px solid #2a2a2a;
      border-radius:30px;
      padding:40px 28px;
      text-align:center;
    }

    .title{
      font-size:34px;
      font-weight:700;
      margin-bottom:12px;
    }

    .subtitle{
      color:#a1a1a1;
      line-height:1.6;
      margin-bottom:34px;
    }

    .login-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      margin-bottom:14px;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      opacity:0.9;
    }

    .google-btn{
      background:linear-gradient(135deg,#ff2d55,#ff5f7e);
    }

    .facebook-btn{
      background:linear-gradient(135deg,#ff2d55,#ff5f7e);
    }

    .line-btn{
      background:#2a2a2a;
    }

    .back{
      margin-top:20px;
      font-size:14px;
    }

    .back a{
      color:#8d8d8d;
      text-decoration:none;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">
      <span>▣</span> หลังบ้าน
    </div>
  </div>

  <div class="container">

    <div class="card">

      <div class="title">
        เข้าสู่ระบบ
      </div>

      <div class="subtitle">
        เข้าสู่ระบบเพื่อเริ่มใช้งานหลังบ้าน
      </div>

      <a
  href="https://zgmgmkymabisulfxlkvv.supabase.co/auth/v1/authorize?provider=google&redirect_to=https://langbaan-3z1pry2dj-lang-baan-s-projects.vercel.app"
  class="login-btn google-btn"
  style="display:flex;justify-content:center;align-items:center;text-decoration:none;"
>
  เข้าสู่ระบบด้วย Google
      </a>
      <a
  href="https://zgmgmkymabisulfxlkvv.supabase.co/auth/v1/authorize?provider=facebook&redirect_to=https://langbaan-3z1pry2dj-lang-baan-s-projects.vercel.app"
  class="login-btn facebook-btn"
  style="display:flex;justify-content:center;align-items:center;text-decoration:none;"
>
  เข้าสู่ระบบด้วย Facebook
      </a>

      <button
        class="login-btn line-btn"
      >
        เข้าสู่ระบบด้วย LINE
      </button>

      <div class="back">
        <a href="index.html">
          ← กลับหน้าแรก
        </a>
      </div>

    </div>

  </div>


</body>
</html>
